<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Kemper</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="/images/icon.png">
<style>
  :root { --bg: #F2F2F7; --text: #1C1C1E; --sub: #6E6E73; --blue: #007AFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #F5F5F7; --sub: #98989D; --blue: #0A84FF; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); text-align: center; padding: 20px;
         font: 17px/1.5 "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, sans-serif; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { font-size: 32px; margin: 18px 0 6px; }
  p { color: var(--sub); margin: 0 0 22px; }
  a { display: inline-block; background: var(--blue); color: #fff; text-decoration: none; padding: 11px 20px; border-radius: 12px; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <img src="/images/icon.png" alt="Kemper's icon">
    <h1>Nothing mapped to this page.</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">Go to Kemper's home page</a>
  </main>
</body>
</html>
