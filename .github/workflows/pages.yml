name: website

# Publishes web/ to GitHub Pages (kemper.talken.in). Screenshots and the AI instructions come
# straight from docs/, so the site always matches the app.
on:
  push:
    branches: [main]
    paths: ["web/**", "docs/images/**", "docs/AI_INSTRUCTIONS.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp -r web/. _site/
          cp docs/images/*.png _site/images/
          python3 - <<'EOF'
          doc = open("docs/AI_INSTRUCTIONS.md", encoding="utf-8").read()
          text = doc.split("````text\n", 1)[1].rsplit("\n````", 1)[0]
          assert text.startswith("# Instructions"), "couldn't find the instructions block"
          open("_site/ai-instructions.txt", "w", encoding="utf-8").write(text)
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
